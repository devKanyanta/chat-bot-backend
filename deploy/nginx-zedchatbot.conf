# nginx reverse proxy for the ZedChatBot backend.
#
#   sudo cp deploy/nginx-zedchatbot.conf /etc/nginx/sites-available/zedchatbot
#   sudo sed -i 's/api.example.com/api.yourdomain.com/g' /etc/nginx/sites-available/zedchatbot
#   sudo ln -sf /etc/nginx/sites-available/zedchatbot /etc/nginx/sites-enabled/zedchatbot
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.yourdomain.com     # adds TLS + the http->https redirect
#
# Before the first run, replace api.example.com everywhere (the sed above does it)
# and make sure the domain's A record already points at this server.

upstream zedchatbot_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # Leave this in place: certbot uses it to prove domain ownership.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # nginx default is 1m; chat requests can carry a 2000-char message plus history.
    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://zedchatbot_backend;
        proxy_http_version 1.1;
        # Empty Connection header keeps the upstream keepalive pool alive.
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- the part that matters for this app -------------------------------
        # POST /api/v1/chat/stream returns text/event-stream and can take minutes
        # before the first token arrives (measured 47 s to 294 s under current
        # Gemini load). nginx's defaults buffer the body and time the upstream
        # out after 60 s, which turns a slow-but-successful reply into a
        # truncated stream. So: buffering off, generous timeouts.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location = /health {
        proxy_pass http://zedchatbot_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
    }

    # --- optional: serve the built React frontend from the same domain --------
    # Build it locally (`npm run build` in chat-bot-frontend-react) and upload
    # dist/ to /var/www/zedchatbot, then uncomment. Keep the /api/ and /health
    # blocks above so they still take priority.
    #
    # root /var/www/zedchatbot;
    # index index.html;
    # location / {
    #     try_files $uri $uri/ /index.html;
    # }
}
